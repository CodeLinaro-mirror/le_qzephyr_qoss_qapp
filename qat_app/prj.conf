# two wifi drv iface support
CONFIG_WIFI_NM=y
CONFIG_NET_IF_MAX_IPV6_COUNT=2
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=4

# ============================================
# Qualcomm AT Config
# ============================================

# enable RING_SERVICE
CONFIG_RING_SERVICE=y

# Enable libcat
CONFIG_CAT=y

# Enable QAT
CONFIG_QAT=y
CONFIG_QAT_SERVICE_STACK_SIZE=8192

# Enable QAT COMMON COMMAND
CONFIG_QAT_COMMON=y
CONFIG_QAT_WLAN=y

# Enable HTTP client AT feature
CONFIG_HTTPC_AT=n
CONFIG_HTTPC_AT_TLS=n
CONFIG_QAT_HTTPC=n

# Enable MQTT client AT feature
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MQTTC_AT=y
CONFIG_QAT_MQTTC=y
# Increase TCP workqueue stack (default 1024 overflows into rx_stack during MQTT QoS1)
# Root cause: work_q_stack at 0x45e08 grows into rx_stack at 0x45708 -> EXC_RETURN corruption
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
# Increase rx_q[0] stack for TCP+MQTT processing (default 1792 is too small)
CONFIG_NET_RX_STACK_SIZE=4096
# Increase max TCP connections: 2 MQTT sessions + DNS + ring = 4 minimum, use 8 for margin
CONFIG_NET_MAX_CONN=8
# Increase recv_thread stack: hex_buf[2001] + payload_buf[1001] = 3002 bytes on stack overflows 2048 default
CONFIG_MQTTC_AT_RECV_THREAD_STACK_SIZE=4096

# HTTPC AT TLS / certificate loading prerequisites
CONFIG_TLS_CREDENTIALS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FLASH_MAP=y

# TLS record buffer: default inherits NET_BUF_DATA_SIZE=1500 which is too small
# for the TLS handshake. The server Certificate message can exceed 1500 bytes,
# causing MBEDTLS_ERR_SSL_BUFFER_TOO_SMALL. Zephyr's tls_mbedtls_handshake()
# maps all unhandled mbedTLS errors to ENOMEM, so zsock_connect() returns -12.
# 4096 bytes is sufficient for typical server certificate chains.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=4096

# HTTP Server for WiFi provisioning (AT+WEBSERVER)
CONFIG_FDTABLE=y
CONFIG_HTTP_SERVER=y
CONFIG_QAT_HTTPSERVER=y
# Dual-stack: 4 services (HTTP IPv4/v6 + HTTPS IPv4/v6)
CONFIG_HTTP_SERVER_NUM_SERVICES=4
# Limit to 1 concurrent HTTPS client: each TLS context needs ~8KB heap
# (2 x MBEDTLS_SSL_MAX_CONTENT_LEN=4096). Browser sends 4-6 parallel
# connections which exhausts the ~42KB free RAM. 1 client is sufficient
# for the provisioning use case.
CONFIG_HTTP_SERVER_MAX_CLIENTS=1
# Reduce TIME-WAIT duration (default 1500ms) so connections clear faster.
CONFIG_NET_TCP_TIME_WAIT_DELAY=250
# Increase TCP connection pool to handle residual connections during HTTPS testing.
CONFIG_NET_MAX_CONN=24
# HTTPS server needs 2 TLS contexts: 1 listen socket + 1 client connection.
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=3

# ============================================
# mbedTLS debug: enable ECDHE-RSA and debug log for B4 mutual-auth diagnosis
# ============================================
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
CONFIG_MBEDTLS_LOG_LEVEL_DBG=y
CONFIG_HTTPC_AT_LOG_LEVEL=4

# Increase TLS handshake timeout: default 3s is too short for RSA mutual-auth
# on software mbedTLS (no HW crypto). 30s gives enough margin.
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=30000

CONFIG_RING0_DESC_COUNT=8
CONFIG_RING0_BUF_SIZE=1400
# at demo unuse ring1 and ring 2, decrease count to save memory
CONFIG_RING1_DESC_COUNT=2
CONFIG_RING1_BUF_SIZE=64
CONFIG_RING2_DESC_COUNT=2
CONFIG_RING2_BUF_SIZE=64
# ============================================
# DNS Resolver
# ============================================
CONFIG_DNS_RESOLVER=y

# ============================================
# SNTP Client
# ============================================
CONFIG_SNTP=y

# file store and WiFi credential persistence
CONFIG_QAT_FSTORE=y
CONFIG_QAT_WIFI_CRED=y

# ============================================
# OTA AT Commands
# ============================================
CONFIG_QAT_OTA=y
CONFIG_QCOM_FW_UPGRADE=y

