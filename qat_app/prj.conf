# nothing here

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y

# ============================================
# IPv6 ND / RS / RA / DAD (for SLAAC autoconf)
# ============================================
# (Most are default-y when NET_IPV6 is enabled, but set explicitly for clarity)
CONFIG_NET_IPV6_NBR_CACHE=y
CONFIG_NET_IPV6_ND=y
CONFIG_NET_IPV6_DAD=y
CONFIG_NET_IPV6_RS_TIMEOUT=1
CONFIG_NET_INITIAL_HOP_LIMIT=64

# If you want DNS server info from Router Advertisement (RDNSS)
CONFIG_NET_IPV6_RA_RDNSS=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_MGMT=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_ETH_DRIVER=n
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_SHELL=y
# HTTP server grabs the only eventfd slot (ZVFS_EVENTFD_MAX=1 default) before
# socket service thread starts, causing zvfs_eventfd failed (-12) at boot and
# DHCPv4 server failure. Increase to 2 so both can run concurrently.
CONFIG_ZVFS_EVENTFD_MAX=2
CONFIG_NET_MAX_CONTEXTS=16
# dhcp
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_WIFI_QCOM_AUTO_DHCPV4=y
CONFIG_NET_DHCPV4_INITIAL_DELAY_MAX=2

CONFIG_WIFI=y
CONFIG_WIFI_QCOM=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_L2_WIFI_MGMT=y

CONFIG_NET_LOG=y
CONFIG_NET_L2_ETHERNET_LOG_LEVEL_DBG=n
CONFIG_NET_L2_WIFI_MGMT_LOG_LEVEL_DBG=y
CONFIG_NET_MGMT_EVENT_LOG_LEVEL_DBG=n
CONFIG_WIFI_LOG_LEVEL_DBG=y

# increase CONFIG_NET_BUF_DATA_SIZE to 512, allow more net buffer allocated.
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_NET_MGMT_EVENT_STACK_SIZE=3072
# increase SYSTEM_WORKQUEUE_STACK_SIZE to 2048, fix potential stack overflow issues.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# zperf
CONFIG_NET_ZPERF=y
CONFIG_NET_ZPERF_SERVER=y
# allow more ZVFS_POLL (increased to 32 for HTTP server)
CONFIG_ZVFS_POLL_MAX=32

#power
CONFIG_PM=y
CONFIG_STATS=n
CONFIG_PM_STATS=y

# counter driver.
CONFIG_COUNTER=y

# RTC driver
CONFIG_RTC=y
CONFIG_RTC_QCC730=y
# RTC shell
CONFIG_RTC_SHELL=y

CONFIG_WIFI_TSF_RTC_CORRECTION=y

# avoid stack overflow in the idle task thread.
CONFIG_IDLE_STACK_SIZE=1024

# enable SEGGER RTT
#CONFIG_UART_CONSOLE=n
#CONFIG_RTT_CONSOLE=y
#CONFIG_USE_SEGGER_RTT=y
#CONFIG_SHELL_BACKEND_SERIAL=n
#CONFIG_SHELL_BACKEND_RTT=y

# Crash dump configuration of two backend options:
# 1) Logging backend:
#    # CONFIG_DEBUG_COREDUMP=y
#    # CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y
# 2) Flash partition backend:
#    # CONFIG_DEBUG_COREDUMP=y
#    # CONFIG_DEBUG_COREDUMP_BACKEND_FLASH_PARTITION=y
#    # CONFIG_DEBUG_COREDUMP_SHELL=y
#    # CONFIG_FLASH=y
#    # CONFIG_FLASH_MAP=y
#    # CONFIG_FLASH_PAGE_LAYOUT=y

CONFIG_NET_ZPERF_MAX_PACKET_SIZE=1500

CONFIG_FLASH=y
CONFIG_FLASH_QCC730=y
CONFIG_BOARD_QCC730_UART_GPIO_OPTION=1
CONFIG_PM_DEVICE=y

CONFIG_GPIO=y
CONFIG_GPIO_SHELL=y

# Use standard mbedTLS for HTTPC/TLS in qat_app. The current qcrypto RSA ALT
# path does not provide the full PK/X509 API set needed by HTTPS.
# CONFIG_QCRYPTO is not set
CONFIG_MBEDTLS=y
# CONFIG_MBEDTLS_BUILTIN selects the built-in mbedTLS implementation with full
# X.509/PEM certificate parsing support. Without it, cert parsing fails with
# MBEDTLS_ERR_X509_INVALID_FORMAT (-0x2180). CONFIG_MBEDTLS_TEST is a minimal
# test-only config that lacks complete X.509 support.
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_MBEDTLS_ASN1_PARSE_C=y
CONFIG_MBEDTLS_PEM_CERTIFICATE_FORMAT=y

CONFIG_CODE_DATA_RELOCATION=y
CONFIG_DP_RAM_LOCATED=y

CONFIG_NET_PKT_TX_COUNT=20
CONFIG_NET_PKT_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_DATA_SIZE=1500
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=20000
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_NET_BUF_POOL_USAGE=y

# Optimize for speed - required for WiFi throughput performance
# Note: Increases 50KB code size, verified to fit within QCC730 constraints
CONFIG_SPEED_OPTIMIZATIONS=y



