sample:
  name: Watchdog driver sample for QCC730
common:
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "Watchdog sample application"
      - "Feeding watchdog..."
      - "No more feeds, waiting for reset"
      - "Watchdog sample application"
tests:
  sample.drivers.watchdog.qcc730_wdt:
    platform_allow:
      - qcc730mi
