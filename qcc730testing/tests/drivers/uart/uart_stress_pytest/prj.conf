CONFIG_ZTEST=y
CONFIG_ZTRESS=y
CONFIG_ZTRESS_MAX_THREADS=5

CONFIG_SERIAL=y
#CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_UART_CONSOLE=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

CONFIG_LOG=y
CONFIG_CRC=y

CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SHELL=n

# Medium-run config for UART stress validation
CONFIG_RX_TEST_SIZE_KB=1024
CONFIG_TX_TEST_SIZE_KB=1024
