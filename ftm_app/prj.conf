# nothing here

#CONFIG_FREERTOS_PLUS_POSIX=y
CONFIG_FTM_MODE=y
CONFIG_6G_BAND=y
#CONFIG_LWIP_HEAP_POOL=y

CONFIG_SOC_FAMILY_QCOM=y
CONFIG_QWIFI=y
CONFIG_QURT_ABSTRACTION_LAYER=y
CONFIG_QSYSTEM=y
CONFIG_QHW_SUPPORT=y
CONFIG_QPOWER=y

# Serial/UART Configuration
CONFIG_SERIAL=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
#CONFIG_UART_CONSOLE=y
#CONFIG_SHELL=n
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y


# FTM Application Configuration
CONFIG_FTM_UART_BAUDRATE=115200
CONFIG_FTM_RX_BUFFER_SIZE=256
CONFIG_FTM_TX_BUFFER_SIZE=256
CONFIG_FTM_POLL_INTERVAL_MS=10

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=n

# Main Stack Size
CONFIG_MAIN_STACK_SIZE=2048

# Clock Configuration (adjust for QCC730)
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Thread Configuration
CONFIG_THREAD_STACK_INFO=y

#RTT
CONFIG_COUNTER=y
CONFIG_IDLE_STACK_SIZE=512
# enable SEGGER RTT
CONFIG_SHELL=y
#CONFIG_SEGGER_RTT=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_RTT=y
#CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
#CONFIG_LOG_BACKEND_RTT=y
#CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
#CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=64
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
