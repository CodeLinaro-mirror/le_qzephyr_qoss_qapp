#
# QCC730 RCP app: QCC730-specific config layer on top of the upstream
# rcp_zephyr sample app. Values here either override or supplement the
# upstream prj.conf defaults.

# RCP bus (QCC730-specific)
CONFIG_QUALCOMM_RCP_BUS_DRIVERS=y
CONFIG_QCC730_RCP_BUS_QCSPI=y
CONFIG_QUALCOMM_RCP_DEFAULT_BUS_SPI=y
CONFIG_GPIO=y
# QcSPI hardware driver — required for HOST_INT0/1 ISR (ring_rx/tx handlers)
CONFIG_SPI=y
CONFIG_SPI_QCC730=y

# RCP protocol (aligned with upstream tuning)
CONFIG_QUALCOMM_RCP_PROTOCOL_NUM_BUFFERS=40
CONFIG_QUALCOMM_RCP_RCP_MAX_TX_EVENTS=40
CONFIG_QUALCOMM_RCP_SEQ_NUM_ACK_WINDOW=7
CONFIG_QUALCOMM_RCP_PROTOCOL_BUFFER_SIZE=1600
CONFIG_QUALCOMM_RCP_INIT_PRIORITY=80

# Init: loopback test stream
CONFIG_INCLUDE_TRANSPORT_TESTS=y

# WiFi
CONFIG_QWIFI=y
CONFIG_WIFI=y
CONFIG_WIFI_QCOM=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y
CONFIG_ETH_PHY_DRIVER=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_NM_MAX_MANAGED_INTERFACES=2

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
# In RCP mode QCC730 is a transparent L2 proxy — the host (RPi) runs DHCP.
# Disabling auto-DHCP prevents QCC730 from claiming its own IP, which would
# cause the AP to see two clients and may cause DHCP Offers to be consumed
# by QCC730's own network stack before reaching the host.
CONFIG_WIFI_QCOM_AUTO_DHCPV4=n
CONFIG_NET_DHCPV4_INITIAL_DELAY_MAX=2
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_PACKET=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=8
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2560
CONFIG_NET_CONTEXT_RCVTIMEO=y

# Network buffers (upstream tuning)
CONFIG_NET_CONTEXT_NET_PKT_POOL=y
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_BUF_DATA_SIZE=1514

# Kernel
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_PREFER_POOL=y

# Nanopb (needed by proxy_wifi_mgmt.c)
CONFIG_NANOPB=y

# Entropy (required by networking stack for random port/seq numbers)
CONFIG_TEST_RANDOM_GENERATOR=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_PRINTK=y

# Shell (serial debug)
CONFIG_SHELL=y
CONFIG_SHELL_BACKENDS=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y

# Disable features not used in RCP mode
CONFIG_RING_SERVICE=n
CONFIG_BT=n

# WPA2-PSK: accept pre-computed PMK from host, bypass firmware PBKDF2
CONFIG_WIFI_PMK_BYPASS_KDF=y

CONFIG_QCRYPTO=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_TEST=y
