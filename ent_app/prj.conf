# ============================================
# WPA2 Enterprise (802.1X/EAP) support
# ============================================
# 1. wpa_supplicant core (EAP state machine, EAPOL TX/RX)
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_CLI=y
# Optimization P0-1: remove wpa_printf format strings from rodata (~50-70 KB flash)
CONFIG_WIFI_NM_WPA_SUPPLICANT_NO_DEBUG=y

# Optimization P0-2: exclude TLS server code (client-only device) (~4 KB flash)
CONFIG_MBEDTLS_SSL_SRV_C=n

# 2. QCC730 Enterprise glue layer (EAPOL RX demux, EVENT_ASSOC injection, maxStart=0)
CONFIG_WIFI_QCOM_ENTERPRISE=y

# 3. Enterprise EAP methods + TLS 1.2 + certificate library (selects MBEDTLS_SSL_PROTO_TLS1_2, WIFI_CERTIFICATE_LIB)
CONFIG_WIFI_NM_WPA_SUPPLICANT_CRYPTO_ENTERPRISE=y

# 4. mbedTLS ALT backend (interfaces with libcryptoqcc730.a; default CRYPTO_BACKEND choice, declared explicitly to avoid ambiguity)
CONFIG_WIFI_NM_WPA_SUPPLICANT_CRYPTO_ALT=y

# 5. TLS 1.2 (hard dependency for EAP-PEAP/TTLS outer tunnel; already selected by CRYPTO_ENTERPRISE, kept explicit here)
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y

# 9. Disable advanced Wi-Fi features not needed for enterprise EAP authentication.
#    QCC730 firmware handles all MAC-layer QoS, roaming, and radio management.
#    Without this, ADVANCED_FEATURES defaults to y and pulls in:
#      robust_av.c (99.7 KB), wmm_ac.c (64.4 KB), wnm_sta.c (94.4 KB),
#      rrm.c (87.3 KB), op_classes.c (50.3 KB), mbo.c (66.6 KB) → ~463 KB total
CONFIG_WIFI_NM_WPA_SUPPLICANT_ADVANCED_FEATURES=n

# 10. Use only EAP methods required by our test matrix:
#     TC-02/05: EAP-PEAP/MSCHAPv2, TC-03/14: EAP-TTLS/MSCHAPv2, TC-06/07: EAP-TLS
#     EAP_ALL default-y also includes EAP_GTC (~10 KB) which we never use; disable it.
CONFIG_EAP_ALL=n
CONFIG_EAP_TLS=y
CONFIG_EAP_PEAP=y
CONFIG_EAP_TTLS=y
CONFIG_EAP_MSCHAPV2=y

# 5a. mbedTLS crypto algorithms required by EAP-TLS/PEAP/TTLS:
#     - ECDHE_RSA/ECDHE_ECDSA cipher suites for TLS handshake
#     - RSA for server cert verification (RSA-2048 on RADIUS server)
#     - MD5/SHA384 for MSCHAPv2 inner auth and PEAP inner tunnel
#     - CMAC for AES-CMAC in EAP key derivation
#     - DHM for DHE-RSA cipher suites (fallback if ECDHE unavailable)
#CONFIG_MBEDTLS_CIPHER_MODE_CTR_ENABLED=y
CONFIG_MBEDTLS_MD5=y
#CONFIG_MBEDTLS_SHA384=y
# ECP curves controlled by P3-3 optimization below (ECP_ALL=n, only secp256r1)
CONFIG_MBEDTLS_CMAC=y
CONFIG_MBEDTLS_PK_WRITE_C=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_RSA_C=y
CONFIG_MBEDTLS_PKCS1_V15=y
CONFIG_MBEDTLS_PKCS1_V21=y
#CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_PSK_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
#CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_DHM_C=y

# 6. mbedTLS heap configuration.
#
#    DEDICATED HEAP HISTORY (builds 46-50) — do not re-enable without careful analysis:
#    Build 46 (heap=18000, 5120): RSA verify PASSES but TLS Finished rejected (wrong master_secret).
#    Build 47 (heap=18000, 6144): RSA-3072 MPI_ALLOC_FAILED → fatal:decrypt_error.
#    Build 48 (heap=19000, 6144): WiFi init blocks — only 580B RAM free.
#    Build 50 (heap=18000, 6144, MCUmgr 4KB): TLS stalls at Server Certificate —
#      silent ALLOC_FAILED mid-handshake. Peak mbedTLS need = SSL buffers(12KB) +
#      handshake struct(5KB) + x509 cert(3KB) + RSA-2048 MPI(2KB) = ~22KB > 18KB.
#
#    CURRENT APPROACH: MBEDTLS_ENABLE_HEAP=n (Zephyr system heap).
#    CRITICAL — DO NOT change to y: QCC730 RSA alt blob pre-initializes ctx->RN.p
#    to a static buffer (not mbedtls_calloc'd). When ENABLE_HEAP=y, the dedicated
#    pool allocator calls mbedtls_free() on that static pointer → HardFault double
#    fault at boot (completely silent, 0 bytes on serial). Confirmed by Build 51.
#    k_free() (system heap) handles arbitrary pointers safely.
#    System heap (~60KB after stacks) gives plenty of headroom for mbedTLS ~22KB peak.
#    NOTE: Do NOT reduce SSL_MAX_CONTENT_LEN below 6144.
#    NOTE: Do NOT switch RADIUS back to RSA-3072.
CONFIG_MBEDTLS_ENABLE_HEAP=n
#
# TLS IN/OUT record buffers: 6144 bytes (minimum working value for all EAP types).
# NOTE: Do NOT reduce below 6144 — 5120 causes wrong master_secret → TLS Finished rejected.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=6144

# 7. Disable interface monitor: prevents race between wpa_supplicant interface thread
#    and QCC730 driver initialization that would cause EAPOL events to be lost
CONFIG_WIFI_NM_WPA_SUPPLICANT_INF_MON=n

# 8. Disable WPA3/SAE on wpa_supplicant side: QCC730 firmware already implements SAE;
#    compiling both sides causes symbol conflicts
CONFIG_WIFI_NM_WPA_SUPPLICANT_WPA3=n

# Lower wpa_supplicant thread priority so QURT tasks (WLAN MAC, data_path) can run.
# Default priority 0 (highest) starves all QURT tasks and fills WLAN message queue.
CONFIG_WIFI_NM_WPA_SUPPLICANT_PRIO=10

# Increase stack for wpa_supplicant thread: mbedTLS X.509 cert parsing during
# EAP-PEAP TLS handshake needs more than the default 8192 bytes (stack overflow
# at handshake state=2 confirmed by USAGE FAULT at PC inside noinit/stack area).
# 16384 not enough either: BUS FAULT at state=9 (TLS Finished / PEAP inner auth)
# with BFAR=0x380000 (stack guard). 32768 borderline: Build 22 succeeded once,
# Build 23 crashed again at state=9 with USAGE FAULT (non-deterministic overflow
# — r0/lr/r4/r5/r10=0x36363636 indicates corrupted stack frame).
# 40960 (40 KB) still non-deterministic: Build 24/25 passed state=9 (stalled at
# state=12); Build 26 crashed at state=9 with BUS FAULT BFAR=0xa0000 (corrupted
# heap pointer dereferenced into flash — deeper cert-verify call path).
# 49152 (48 KB) caused OOM at state=4 with net_buf=40 (heap ~27KB too small for RSA).
# 45056 (44 KB): stable in Build 29 (net_buf=20, heap=97KB). BUT Build 30 added 5
# local variables to qwifi_drv_send (~16 bytes extra frame in EAPOL TX call chain),
# tipping state=9 over → BUS FAULT BFAR=0xa0000. Stack margin was <16 bytes.
# 49152 (48 KB): safe again with net_buf=20 → heap ~93KB (97KB - 4KB BSS delta).
# RSA at state=4 needs ~23KB; 93KB leaves 70KB headroom.  Build 31.
# WPA3-ENT type 21 passed at 49152 (Build 36), but WPA2-ENT type 12 crashes at
# state=9 with PSP=0 (full stack exhaustion) — ieee80211w=0 path uses slightly
# more stack depth (EAPOL/RSN path diverges). Increased to 65536 (64 KB).
# Heap impact: -16KB → heap ~77KB; still 54KB headroom for 23KB RSA need.
# EAP-TLS state=3 (SERVER_CERTIFICATE, RSA 3072-bit) crashes at 65536 with
# USAGE FAULT PC=0x0 LR=0x0 (stack overflow: thread frame corrupted).
# Increased to 81920 (80 KB) to give EAP-TLS cert verification headroom.
# Heap impact: -16KB → heap ~61KB; still 38KB headroom for 23KB RSA need.
#
# Build 51 (2026-05-16): Attempted 49152 and 65536 with step-loop in tls_mbedtls_alt.c.
# Both fail silently at state=3 (SERVER_KEY_EXCHANGE: ECDHE + RSA-2048 signature verify).
# step_done state=2->3 ret=0 is printed, but state=3 step never returns — no USAGE FAULT,
# no stack sentinel, silent hang. Reverted to 81920 (80 KB). The step-loop reduces peak
# TOTAL depth (no need to hold all states simultaneously), but the deepest single state
# (state=3: RSA-2048 verify + ECDHE key ops) still exceeds 64KB alone.
# Minimum safe stack for EAP-TLS with RSA-2048 + ECDHE: >64KB, ≤80KB.
# (Stack reduction goal abandoned for now — need profiling to find actual minimum.)
# Optimization P1-1: reduce supplicant thread stack 80KB→64KB (-16KB RAM)
# EAP-TLS (deepest path) tested at 64KB - if TC_WPA3_003 regresses, revert.
CONFIG_WIFI_NM_WPA_SUPPLICANT_THREAD_STACK_SIZE=65536
# shell_uart thread overflows at 2048 when processing "wifi connect -k 7"
# (wifi_set_enterprise_credentials call chain depth).  Increase to 8192.
# Still overflowing at 4096 (~4.7KB usage measured at arch_swap detection point).
CONFIG_SHELL_STACK_SIZE=8192
# Enable stack sentinel to detect overflow: prints thread name instead of USAGE FAULT
CONFIG_STACK_SENTINEL=y

# Optimization P2: fullmac mode excludes scan.c/sme.c/bss.c/ctrl_iface.c/ctrl_iface_zephyr.c
# wpa_cli_cmds.c/wpa_cli_zephyr.c from the build (~75 KB flash).
CONFIG_WIFI_NM_WPA_SUPPLICANT_FULLMAC=y

# Optimization P3-1 (CRL): tls_mbedtls_alt.c uses mbedtls_x509_crl_* in 10+ places
# without #ifdef guards; guarding them requires invasive source changes for only ~2.2 KB.
# Skipped — not worth the maintenance burden.

# Optimization P3-2: NIST Key Wrap skipped — libwifiqcc730.a calls mbedtls_nist_kw_*;
# cannot remove without breaking the prebuilt blob.

# Optimization P3-3: keep only P-256 (secp256r1) for enterprise TLS ECDHE.
# All 5 test cases use AKM5 (WPA-EAP-SHA256, -k 21) or WPA2-Enterprise (-k 12);
# none use Suite B 192-bit (AKM12) which would require P-384.
# Savings: ~8-12 KB flash (ecp_curves constant tables for 13 removed curves).
# Note: removed "select MBEDTLS_ECP_ALL_ENABLED" from WIFI_NM_WPA_SUPPLICANT_CRYPTO_ALT
# in zephyr/modules/hostap/Kconfig for this to take effect.
CONFIG_MBEDTLS_ECP_ALL_ENABLED=n
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y

# Optimization P3-D: FULLMAC build loads certs via LFS ("wifi load_certs /lfs"),
# not via Zephyr TLS credential shell API; this heap pool is never used.
# Gated on FULLMAC: non-FULLMAC builds that use shell cert loading must NOT set this.
CONFIG_HEAP_MEM_POOL_ADD_SIZE_TLS_CRED_SHELL=0

