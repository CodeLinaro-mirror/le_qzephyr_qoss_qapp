# nothing here

CONFIG_NET_IPV6_FRAGMENT_MAX_COUNT=4
CONFIG_NET_IPV6_FRAGMENT_MAX_PKT=4
CONFIG_NET_IPV6_FRAGMENT_TIMEOUT=5
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_ETH_DRIVER=n
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_SHELL=y
# dhcp
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_WIFI_QCOM_AUTO_DHCPV4=y
CONFIG_NET_DHCPV4_INITIAL_DELAY_MAX=2

CONFIG_WIFI=y
CONFIG_WIFI_QCOM=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_L2_WIFI_MGMT=y

CONFIG_NET_LOG=y
CONFIG_NET_L2_ETHERNET_LOG_LEVEL_DBG=n
CONFIG_NET_L2_WIFI_MGMT_LOG_LEVEL_DBG=y
CONFIG_NET_MGMT_EVENT_LOG_LEVEL_DBG=n
CONFIG_WIFI_LOG_LEVEL_DBG=y

# increase CONFIG_NET_BUF_DATA_SIZE to 512, allow more net buffer allocated.
CONFIG_NET_BUF_DATA_SIZE=512
# increase NET_MGMT_EVENT_STACK_SIZE to 1024, fix potential stack overflow issues.
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1024
# increase SYSTEM_WORKQUEUE_STACK_SIZE to 2048, fix potential stack overflow issues.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# zperf
CONFIG_NET_ZPERF=y
CONFIG_NET_ZPERF_SERVER=y
# allow more ZVFS_POLL
CONFIG_ZVFS_POLL_MAX=16
CONFIG_ZPERF_WORK_Q_THREAD_PRIORITY=7

#power
CONFIG_PM=y
CONFIG_STATS=y
CONFIG_PM_STATS=y

# counter driver.
CONFIG_COUNTER=y

# RTC driver
CONFIG_RTC=y
CONFIG_RTC_QCC730=y
# RTC shell
CONFIG_RTC_SHELL=y

CONFIG_WIFI_TSF_RTC_CORRECTION=y

# avoid stack overflow in the idle task thread.
CONFIG_IDLE_STACK_SIZE=1024

# enable SEGGER RTT
#CONFIG_UART_CONSOLE=n
#CONFIG_RTT_CONSOLE=y
#CONFIG_USE_SEGGER_RTT=y
#CONFIG_SHELL_BACKEND_SERIAL=n
#CONFIG_SHELL_BACKEND_RTT=y

# Crash dump configuration of two backend options:
# 1) Logging backend:
#    # CONFIG_DEBUG_COREDUMP=y
#    # CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y
# 2) Flash partition backend:
#    # CONFIG_DEBUG_COREDUMP=y
#    # CONFIG_DEBUG_COREDUMP_BACKEND_FLASH_PARTITION=y
#    # CONFIG_DEBUG_COREDUMP_SHELL=y
#    # CONFIG_FLASH=y
#    # CONFIG_FLASH_MAP=y
#    # CONFIG_FLASH_PAGE_LAYOUT=y

CONFIG_NET_ZPERF_MAX_PACKET_SIZE=1500

CONFIG_FLASH=y
CONFIG_FLASH_QCC730=y
CONFIG_BOARD_QCC730_UART_GPIO_OPTION=1
CONFIG_PM_DEVICE=y

CONFIG_GPIO=y
CONFIG_GPIO_SHELL=y

CONFIG_QCRYPTO=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_TEST=y

CONFIG_CODE_DATA_RELOCATION=y
CONFIG_DP_RAM_LOCATED=y

CONFIG_NET_PKT_TX_COUNT=40
CONFIG_NET_PKT_RX_COUNT=40
CONFIG_NET_BUF_TX_COUNT=40
CONFIG_NET_BUF_RX_COUNT=40
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=20000
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_NET_BUF_POOL_USAGE=y
CONFIG_NET_DISABLE_ICMP_DESTINATION_UNREACHABLE=y
#increase TCP_RETRY_COUNT from 9 to 20 for noisy environment
CONFIG_NET_TCP_RETRY_COUNT=20
# enable RX thread schedule, disable by default
# CONFIG_NET_TC_THREAD_PREEMPTIVE=y
# CONFIG_NET_TC_THREAD_PRIO_CUSTOM=y
# CONFIG_NET_TC_RX_THREAD_BASE_PRIO=6


# Optimize for speed - required for WiFi throughput performance
# Note: Increases 50KB code size, verified to fit within QCC730 constraints
CONFIG_SPEED_OPTIMIZATIONS=y



# ============================================
# MCUmgr Configuration
# ============================================
# ZCBOR - required for MCUmgr
CONFIG_ZCBOR=y
CONFIG_ZCBOR_CANONICAL=y

# MCUmgr Core - basic MCUmgr support
CONFIG_MCUMGR=y

# ============================================
# Qualcomm Image Management
# ============================================
# Main switch - enables all required MCUmgr dependencies automatically
CONFIG_QCOM_IMG_MGMT=y
CONFIG_QCOM_IMG_MGMT_LOG_LEVEL_INF=y

# Override default Kconfig values if needed
CONFIG_QCOM_IMG_MGMT_ZCBOR_MAX_STR_LEN=1024
CONFIG_QCOM_IMG_MGMT_UDP_PORT=1337
CONFIG_QCOM_IMG_MGMT_UDP_MTU=1500
CONFIG_QCOM_IMG_MGMT_NETBUF_COUNT=4
CONFIG_QCOM_IMG_MGMT_NETBUF_SIZE=4096
CONFIG_QCOM_IMG_MGMT_SHA256_SUPPORT=y

# ============================================
# Qualcomm Watchdog Config
# ============================================
# Always enabled to ensure watchdog code is compiled
CONFIG_WATCHDOG=y
# Enable watchdog functionality
# CONFIG_QWDT=y
# CONFIG_WATCH_DOG_BITE_TIME=8

# Enable runtime NMI for watchdog bark handling
# CONFIG_RUNTIME_NMI=y

# secure storage configuration
#CONFIG_MBEDTLS_PSA_CRYPTO_C=y
#CONFIG_SECURE_STORAGE=y
#CONFIG_SECURE_STORAGE_ITS_IMPLEMENTATION_ZEPHYR=y
#CONFIG_SECURE_STORAGE_ITS_STORE_MODULE=y
#CONFIG_SECURE_STORAGE_ITS_TRANSFORM_AEAD_SCHEME_CUSTOM=y
#CONFIG_SECURE_STORAGE_ITS_TRANSFORM_AEAD_KEY_PROVIDER_CUSTOM=y
#CONFIG_ZMS=y
#CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_ZMS=y
#CONFIG_PSA_WANT_ALG_CCM=y
#CONFIG_PSA_WANT_KEY_TYPE_AES=y
#CONFIG_SECURE_STORAGE_ITS_MAX_DATA_SIZE=2000

# two wifi drv iface support
CONFIG_WIFI_NM=y
CONFIG_NET_IF_MAX_IPV6_COUNT=2
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=4

# enable fragmentation for IPv6 zperf
CONFIG_NET_IPV6_FRAGMENT=y

# support multiple tx streams at the same time
#CONFIG_ZPERF_SESSION_PER_THREAD=y
