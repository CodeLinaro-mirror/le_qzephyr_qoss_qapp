CONFIG_SPI=y
CONFIG_GPIO=y

# Enable logging
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
# Enable the Zephyr Shell subsystem
CONFIG_SHELL=y

# Enable the serial/UART backend for the shell
CONFIG_SHELL_BACKEND_SERIAL=y

CONFIG_SHELL_STACK_SIZE=2048

CONFIG_MAIN_STACK_SIZE=2048

CONFIG_HEAP_MEM_POOL_SIZE=131072

# Increase log buffer size for debug output
CONFIG_LOG_BUFFER_SIZE=2048

#CONFIG_RING_SERVICE=y
#enable SPI DMA
CONFIG_DMA=y
CONFIG_SPI_STM32_DMA=y
